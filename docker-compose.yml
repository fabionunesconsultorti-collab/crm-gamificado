version: '3.8'

services:
  # Banco de Dados PostgreSQL para persistência de sessões e dados
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: waha
      POSTGRES_USER: waha_user
      POSTGRES_PASSWORD: waha_password
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  # Redis para gerenciamento de cache e filas
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data

  # Instância principal do WAHA
  waha:
    image: devlikeapro/waha
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Configurações do Banco de Dados
      - WHATSAPP_API_DATABASE_URL=postgresql://waha_user:waha_password@postgres:5432/waha
      # Configurações do Redis
      - WHATSAPP_API_REDIS_URL=redis://redis:6379
      # Ativa a persistência
      - WHATSAPP_API_SESSION_STORAGE=postgres
      # Configurações básicas
      - WHATSAPP_API_HOSTNAME=0.0.0.0
      - TZ=America/Sao_Paulo
      # Credenciais do Dashboard e Swagger (Fixas para não gerar senhas aleatórias)
      - WAHA_DASHBOARD_ENABLED=True
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=admin123
      - WHATSAPP_SWAGGER_USERNAME=admin
      - WHATSAPP_SWAGGER_PASSWORD=admin123
      - WAHA_API_KEY=admin123
    depends_on:
      - postgres
      - redis

  # Servidor de Inteligência Artificial Local (Ollama)
  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0

