{% extends "base.html" %}

{% block auth_content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="text-center mb-4">
            <h2 class="font-bold text-main" style="font-size: 1.8rem;">
                <span class="text-primary">CRM</span> PRO
            </h2>
            <p class="text-muted text-sm mt-1">Faça login para continuar</p>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
            <div class="flash-msg">
                <i class="fa-solid fa-circle-exclamation text-danger"></i> {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="" method="post">
            <div class="form-group">
                <label for="username">Usuário</label>
                <div class="d-flex align-center input-glass p-0 overflow-hidden">
                    <div class="px-3 text-muted"><i class="fa-solid fa-user"></i></div>
                    <input type="text" name="username" id="username" class="flex-1 input-glass" style="border:none;background:transparent;" required placeholder="admin">
                </div>
            </div>
            <div class="form-group mb-4">
                <label for="password">Senha</label>
                <div class="d-flex align-center input-glass p-0 overflow-hidden">
                    <div class="px-3 text-muted"><i class="fa-solid fa-lock"></i></div>
                    <input type="password" name="password" id="password" class="flex-1 input-glass" style="border:none;background:transparent;" required placeholder="••••••••">
                </div>
            </div>
            
            <button type="submit" class="btn-primary w-100 py-3">
                Entrar no Sistema
            </button>
        </form>
    </div>
</div>
{% endblock %}
