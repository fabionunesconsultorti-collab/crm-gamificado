{% extends "base.html" %}

{% block content %}
<div class="header-glass mb-4 justify-between">
    <h3 class="m-0"><i class="fa-brands fa-whatsapp text-success"></i> {{ title }}</h3>
    <a href="javascript:history.back()" class="nav-link p-0 m-0 w-auto">
        <i class="fa-solid fa-arrow-left nav-icon"></i> Voltar
    </a>
</div>

<div class="header-glass max-w-lg mb-4 flex-col align-start m-0">
    <div class="d-flex align-start gap-4 w-100">
        <div class="avatar avatar-lg flex-shrink-0" style="font-size: 1.5rem; background:#34d399;">
            <i class="fa-solid fa-user"></i>
        </div>
        <div class="flex-1">
            <h4 class="m-0 text-main">{{ client.name }}</h4>
            <div class="text-sm text-muted mt-1">Celular: {{ client.phone }}</div>
            <div class="text-xs text-warning mt-1">Nível: {{ client.tier | title }} &middot; Status: {{ client.status | title }}</div>
        </div>
    </div>
</div>

<form action="" method="post" class="w-100 max-w-lg">
    <div class="header-glass flex-col align-start m-0 mb-4">
        
        <div class="form-group w-100">
            <label for="template_id">Escolha um Template</label>
            <select id="template_id" class="input-glass" onchange="updateText()">
                <option value="">-- Mensagem Avulsa (Em branco) --</option>
                {% for t in templates %}
                <option value="{{ t.id }}" data-text="{{ t.text }}">{{ t.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group w-100 mb-0">
            <label for="final_text">Mensagem Pronta (Edite se necessário)</label>
            <textarea name="final_text" id="final_text" class="input-glass" rows="8" placeholder="Digite aqui a sua mensagem e as informações enviadas não ficarão salvas como um evento padrão." style="resize:vertical;" required></textarea>
        </div>
    </div>

    <div class="d-flex gap-3 max-w-lg mb-4">
        <button type="submit" class="btn-primary flex-1" style="background:#25D366; color:#0f172a;">
            <i class="fa-solid fa-paper-plane"></i> GERAR LINK WHATSAPP
        </button>
    </div>
</form>

<script>
    function updateText() {
        const select = document.getElementById('template_id');
        const selectedOption = select.options[select.selectedIndex];
        const textArea = document.getElementById('final_text');
        
        if (selectedOption && selectedOption.dataset.text) {
            textArea.value = selectedOption.dataset.text;
        } else {
            textArea.value = '';
        }
    }
</script>
{% endblock %}
