<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Glowing background ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.3"/>

  <!-- Growth Charts / Bars -->
  <rect x="18" y="34" width="6" height="14" rx="3" fill="url(#glowGrad)"/>
  <rect x="28" y="26" width="6" height="22" rx="3" fill="url(#primaryGrad)"/>
  <rect x="38" y="18" width="6" height="30" rx="3" fill="url(#primaryGrad)" filter="url(#shadow)"/>

  <!-- Trend Rocket Arrow / Spark -->
  <path d="M 36 16 L 48 16 L 48 28" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22 38 L 47 17" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
</svg>
